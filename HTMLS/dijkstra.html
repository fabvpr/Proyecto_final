<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grafo de Red Logística: Algoritmo de Dijkstra</title>
  
  <!-- Tailwind CSS para los estilos -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React y ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel para procesar JSX en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">

  <!-- Contenedor donde React montará la aplicación -->
  <div id="root"></div>

  <!-- Código de la aplicación -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- ÍCONOS (Reemplazando lucide-react para un solo archivo) ---
    const PlayIcon = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
    );
    const PauseIcon = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
    );
    const SkipForwardIcon = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
    );
    const SkipBackIcon = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
    );
    const RotateCcwIcon = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
    );

    // --- DATOS DEL GRAFO ---
    const nodesData = [
      { id: 'A', label: 'A (Origen)', x: 100, y: 250 },
      { id: 'B', label: 'B', x: 300, y: 100 },
      { id: 'C', label: 'C', x: 300, y: 400 },
      { id: 'D', label: 'D', x: 550, y: 100 },
      { id: 'E', label: 'E', x: 550, y: 400 },
      { id: 'F', label: 'F (Destino)', x: 750, y: 250 }
    ];

    const edgesData = [
      { id: 'e1', n1: 'A', n2: 'B', w: 4 },
      { id: 'e2', n1: 'A', n2: 'C', w: 2 },
      { id: 'e3', n1: 'B', n2: 'C', w: 1 },
      { id: 'e4', n1: 'B', n2: 'D', w: 5 },
      { id: 'e5', n1: 'C', n2: 'D', w: 8 },
      { id: 'e6', n1: 'C', n2: 'E', w: 10 },
      { id: 'e7', n1: 'D', n2: 'E', w: 2 },
      { id: 'e8', n1: 'D', n2: 'F', w: 6 },
      { id: 'e9', n1: 'E', n2: 'F', w: 3 }
    ];

    // --- MOTOR DEL ALGORITMO (Generador de Estados) ---
    const generateDijkstraFrames = () => {
      let frames = [];
      let dist = { A: 0, B: Infinity, C: Infinity, D: Infinity, E: Infinity, F: Infinity };
      let prev = { A: null, B: null, C: null, D: null, E: null, F: null };
      let visited = new Set();
      let unvisited = new Set(['A', 'B', 'C', 'D', 'E', 'F']);

      const createFrame = (title, description, activeNode = null, exploringEdge = null, isFinal = false) => {
        return {
          title,
          description,
          dist: { ...dist },
          visited: new Set(visited),
          activeNode,
          exploringEdge,
          isFinal,
          prev: { ...prev }
        };
      };

      frames.push(createFrame(
        "Estado Inicial",
        "El nodo origen 'A' se marca con una distancia de 0. Todos los demás nodos se inicializan con distancia infinito (∞)."
      ));

      while (unvisited.size > 0) {
        // Selección (PriorityQueue simulada)
        let current = null;
        let minDist = Infinity;
        for (let node of unvisited) {
          if (dist[node] < minDist) {
            minDist = dist[node];
            current = node;
          }
        }

        // Condición de parada
        if (current === null || current === 'F') {
          if (current === 'F') {
            frames.push(createFrame(
              "Destino Alcanzado", 
              `Se ha procesado el nodo destino 'F' con una distancia mínima de ${dist['F']}.`, 
              'F'
            ));
          }
          break;
        }

        unvisited.delete(current);
        frames.push(createFrame(
          "Selección del Nodo",
          `Se extrae '${current}' de la cola de prioridad por tener el menor valor acumulado actual (${dist[current]}).`,
          current
        ));

        // Exploración de vecinos
        let neighbors = edgesData.filter(e => e.n1 === current || e.n2 === current);
        for (let edge of neighbors) {
          let neighbor = edge.n1 === current ? edge.n2 : edge.n1;
          
          if (visited.has(neighbor)) continue;

          frames.push(createFrame(
            "Exploración",
            `Desde '${current}', observamos al vecino '${neighbor}' a través de la ruta con distancia física de ${edge.w} km.`,
            current,
            edge.id
          ));

          let newDist = dist[current] + edge.w;
          
          // Relajación
          if (newDist < dist[neighbor]) {
            dist[neighbor] = newDist;
            prev[neighbor] = current;
            frames.push(createFrame(
              "Relajación de Arista (¡Actualización!)",
              `La distancia acumulada previa a '${neighbor}' era ${dist[neighbor] === Infinity ? '∞' : dist[neighbor]}. La nueva ruta por '${current}' es menor (${dist[current]} + ${edge.w} = ${newDist}). Se actualiza el valor.`,
              current,
              edge.id
            ));
          } else {
            frames.push(createFrame(
              "Relajación de Arista (Sin cambios)",
              `La ruta a '${neighbor}' pasando por '${current}' (${newDist}) NO es menor que su valor registrado actualmente (${dist[neighbor]}). Se descarta.`,
              current,
              edge.id
            ));
          }
        }
        visited.add(current);
        frames.push(createFrame(
          "Nodo Procesado",
          `Se han explorado todos los vecinos de '${current}'. Se marca como procesado y no se volverá a visitar.`,
          null
        ));
      }

      frames.push(createFrame(
        "Resultado Final",
        "El algoritmo ha concluido. La ruta óptima se resalta en rojo uniendo la secuencia de nodos.",
        null,
        null,
        true
      ));

      return frames;
    };

    // --- COMPONENTE PRINCIPAL ---
    function App() {
      const frames = useMemo(() => generateDijkstraFrames(), []);
      const [currentStep, setCurrentStep] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const frame = frames[currentStep];

      // Auto-play hook
      useEffect(() => {
        let timer;
        if (isPlaying && currentStep < frames.length - 1) {
          timer = setTimeout(() => {
            setCurrentStep(s => s + 1);
          }, 2500); // 2.5 segundos por paso
        } else if (currentStep === frames.length - 1) {
          setIsPlaying(false);
        }
        return () => clearTimeout(timer);
      }, [isPlaying, currentStep, frames.length]);

      // Construir ruta final para renderizado
      const finalPathEdges = useMemo(() => {
        let path = new Set();
        if (frame.isFinal) {
          let curr = 'F';
          while (frame.prev[curr]) {
            let p = frame.prev[curr];
            let edge = edgesData.find(e => (e.n1 === curr && e.n2 === p) || (e.n2 === curr && e.n1 === p));
            if (edge) path.add(edge.id);
            curr = p;
          }
        }
        return path;
      }, [frame]);

      const handleNext = () => setCurrentStep(Math.min(frames.length - 1, currentStep + 1));
      const handlePrev = () => setCurrentStep(Math.max(0, currentStep - 1));
      const handleReset = () => { setCurrentStep(0); setIsPlaying(false); };
      const togglePlay = () => setIsPlaying(!isPlaying);

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col items-center p-4 sm:p-6">
          
          {/* Encabezado */}
          <div className="w-full max-w-5xl mb-6">
            <h1 className="text-2xl sm:text-3xl font-bold text-slate-800 border-b-2 border-blue-500 pb-2 inline-block">
              Grafo de Red Logística: Algoritmo de Dijkstra
            </h1>
            <p className="text-slate-600 mt-2 text-sm sm:text-base">
              Visualización paso a paso de la búsqueda de la ruta más corta desde el almacén A hasta el almacén F.
            </p>
          </div>

          <div className="flex flex-col xl:flex-row w-full max-w-5xl gap-6">
            
            {/* Panel Izquierdo: El Grafo SVG */}
            <div className="flex-1 bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden relative min-h-[400px]">
              <svg viewBox="0 0 850 500" className="w-full h-full drop-shadow-sm">
                
                {/* Aristas (Conexiones) */}
                {edgesData.map(edge => {
                  const n1 = nodesData.find(n => n.id === edge.n1);
                  const n2 = nodesData.find(n => n.id === edge.n2);
                  const isExploring = frame.exploringEdge === edge.id;
                  const isFinalPath = finalPathEdges.has(edge.id);
                  
                  let strokeColor = "#cbd5e1"; // slate-300
                  let strokeWidth = 3;
                  let strokeDasharray = "none";

                  if (isFinalPath) {
                    strokeColor = "#ef4444"; // red-500
                    strokeWidth = 8;
                  } else if (isExploring) {
                    strokeColor = "#f59e0b"; // amber-500
                    strokeWidth = 5;
                    strokeDasharray = "8,4";
                  }

                  return (
                    <g key={edge.id}>
                      <line 
                        x1={n1.x} y1={n1.y} 
                        x2={n2.x} y2={n2.y} 
                        stroke={strokeColor} 
                        strokeWidth={strokeWidth} 
                        strokeDasharray={strokeDasharray}
                        className="transition-all duration-300"
                      />
                      <circle 
                        cx={(n1.x + n2.x) / 2} 
                        cy={(n1.y + n2.y) / 2} 
                        r="14" 
                        fill="white" 
                        stroke={isExploring ? "#f59e0b" : "#94a3b8"} 
                        strokeWidth="2"
                      />
                      <text 
                        x={(n1.x + n2.x) / 2} 
                        y={(n1.y + n2.y) / 2} 
                        textAnchor="middle" 
                        dominantBaseline="central" 
                        className="text-xs font-bold fill-slate-700"
                      >
                        {edge.w}
                      </text>
                    </g>
                  );
                })}

                {/* Vértices (Nodos) */}
                {nodesData.map(node => {
                  const distVal = frame.dist[node.id];
                  const displayDist = distVal === Infinity ? '∞' : distVal;
                  const isVisited = frame.visited.has(node.id);
                  const isActive = frame.activeNode === node.id;
                  
                  let fillColor = "#ffffff";
                  let strokeColor = "#3b82f6"; // blue-500
                  let textColor = "#1e293b";

                  if (isActive) {
                    fillColor = "#fef08a"; // yellow-200
                    strokeColor = "#ca8a04"; // yellow-600
                  } else if (isVisited) {
                    fillColor = "#dcfce7"; // green-100
                    strokeColor = "#22c55e"; // green-500
                  }

                  if (frame.isFinal) {
                    let isInPath = false;
                    let curr = 'F';
                    while (curr) {
                      if (curr === node.id) isInPath = true;
                      curr = frame.prev[curr];
                    }
                    if (isInPath) {
                      strokeColor = "#ef4444"; // red
                      fillColor = "#fee2e2"; // red-100
                    } else {
                      fillColor = "#f8fafc"; // dim
                      strokeColor = "#cbd5e1";
                      textColor = "#94a3b8";
                    }
                  }

                  return (
                    <g key={node.id} className="transition-all duration-500">
                      <rect 
                        x={node.x - 25} 
                        y={node.y - 45} 
                        width="50" 
                        height="20" 
                        rx="10" 
                        fill={distVal === Infinity ? "#f1f5f9" : "#3b82f6"} 
                        className="transition-colors duration-300 shadow-sm"
                      />
                      <text 
                        x={node.x} 
                        y={node.y - 35} 
                        textAnchor="middle" 
                        dominantBaseline="central" 
                        className={`text-sm font-bold ${distVal === Infinity ? 'fill-slate-500 text-lg' : 'fill-white'}`}
                      >
                        {displayDist}
                      </text>

                      <circle 
                        cx={node.x} 
                        cy={node.y} 
                        r="22" 
                        fill={fillColor} 
                        stroke={strokeColor} 
                        strokeWidth="4" 
                        className="drop-shadow-md"
                      />
                      
                      <text 
                        x={node.x} 
                        y={node.y + 2} 
                        textAnchor="middle" 
                        dominantBaseline="central" 
                        className="text-lg font-black"
                        fill={textColor}
                      >
                        {node.id}
                      </text>
                      
                      <text 
                        x={node.x} 
                        y={node.y + 35} 
                        textAnchor="middle" 
                        className="text-xs font-semibold"
                        fill={textColor}
                      >
                        {node.label}
                      </text>
                    </g>
                  );
                })}
              </svg>
              
              {/* Leyenda flotante */}
              <div className="absolute bottom-4 right-4 bg-white/95 p-3 rounded-lg shadow-md border border-slate-200 text-xs text-slate-600 flex flex-col gap-2 backdrop-blur-sm">
                <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-blue-500"></div> No visitado</div>
                <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-yellow-400"></div> Evaluando Actual</div>
                <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-green-400"></div> Ya Procesado</div>
                <div className="flex items-center gap-2"><div className="w-4 h-1 bg-amber-500"></div> Explorando Arista</div>
                <div className="flex items-center gap-2"><div className="w-4 h-2 bg-red-500"></div> Ruta Óptima</div>
              </div>
            </div>

            {/* Panel Derecho: Controles y Registro del Algoritmo */}
            <div className="w-full xl:w-96 flex flex-col gap-4">
              
              {/* Controles del Reproductor */}
              <div className="bg-white p-5 rounded-xl shadow-md border border-slate-200">
                <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4">Controles de Ejecución</h3>
                <div className="flex justify-center items-center gap-4 mb-4">
                  <button onClick={handleReset} className="p-2 rounded-full hover:bg-slate-100 text-slate-600 transition" title="Reiniciar">
                    <RotateCcwIcon size={20} />
                  </button>
                  <button onClick={handlePrev} disabled={currentStep === 0} className="p-2 rounded-full hover:bg-slate-100 disabled:opacity-30 text-slate-700 transition">
                    <SkipBackIcon size={24} />
                  </button>
                  <button 
                    onClick={togglePlay} 
                    className={`p-4 rounded-full text-white shadow-md transition transform hover:scale-105 flex items-center justify-center ${isPlaying ? 'bg-amber-500 hover:bg-amber-600' : 'bg-blue-600 hover:bg-blue-700'}`}
                  >
                    {isPlaying ? <PauseIcon size={28} /> : <PlayIcon size={28} className="ml-1" />}
                  </button>
                  <button onClick={handleNext} disabled={currentStep === frames.length - 1} className="p-2 rounded-full hover:bg-slate-100 disabled:opacity-30 text-slate-700 transition">
                    <SkipForwardIcon size={24} />
                  </button>
                </div>
                
                {/* Barra de Progreso */}
                <div className="w-full bg-slate-100 rounded-full h-2.5">
                  <div className="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style={{ width: `${(currentStep / (frames.length - 1)) * 100}%` }}></div>
                </div>
                <div className="text-center text-xs text-slate-400 mt-2 font-medium">
                  Paso {currentStep + 1} de {frames.length}
                </div>
              </div>

              {/* Registro de Lógica */}
              <div className="bg-slate-800 rounded-xl shadow-md border border-slate-700 p-6 flex-1 text-slate-100 flex flex-col min-h-[250px]">
                 <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
                    Lógica Actual
                 </h3>
                 <h4 className="text-xl font-bold text-blue-300 mb-3">{frame.title}</h4>
                 <p className="text-slate-300 leading-relaxed text-sm">
                   {frame.description}
                 </p>
                 
                 {/* Datos Técnicos */}
                 <div className="mt-auto pt-4 border-t border-slate-700">
                   <div className="grid grid-cols-[auto_1fr] gap-2 text-xs font-mono bg-slate-900 p-3 rounded-lg items-center">
                      <div className="text-slate-400">Cola de Prioridad:</div>
                      <div className="text-amber-300 text-right truncate" title={['A','B','C','D','E','F'].filter(n => !frame.visited.has(n)).sort((a,b) => frame.dist[a] - frame.dist[b]).map(n => `${n}(${frame.dist[n]===Infinity?'∞':frame.dist[n]})`).join(', ')}>
                        {['A','B','C','D','E','F']
                          .filter(n => !frame.visited.has(n))
                          .sort((a,b) => frame.dist[a] - frame.dist[b])
                          .map(n => `${n}(${frame.dist[n]===Infinity?'∞':frame.dist[n]})`)
                          .join(', ') || 'Vacía'
                        }
                      </div>
                   </div>
                 </div>
              </div>

            </div>
          </div>
        </div>
      );
    }

    // Renderizar la aplicación en el DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
