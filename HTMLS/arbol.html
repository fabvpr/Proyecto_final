<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Árbol Binario de Búsqueda (BST) - Inventario</title>
    <!-- Tailwind CSS cargado vía CDN para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.4s ease-out forwards;
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 4s linear infinite;
        }
        /* Transiciones suaves para elementos SVG */
        .svg-node {
            transition: all 0.5s ease-in-out;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-slate-50 p-6 font-sans">

    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        
        <!-- Cabecera y Controles -->
        <div class="bg-slate-800 p-6 text-white text-center">
            <h1 class="text-2xl font-bold mb-2">Árbol Binario de Búsqueda (BST)</h1>
            <p class="text-slate-300 mb-6">Gestión de Inventario Dinámico</p>
            
            <div class="flex justify-center gap-4">
                <button id="btn-insert" onclick="startInsertion()" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 disabled:opacity-50 rounded-lg font-semibold transition-colors">
                    Lógica de Inserción
                </button>
                <button id="btn-inorder" onclick="startInOrder()" class="px-4 py-2 bg-purple-500 hover:bg-purple-600 disabled:opacity-50 rounded-lg font-semibold transition-colors">
                    Recorrido In-Order
                </button>
                <button onclick="resetApp()" class="px-4 py-2 bg-slate-600 hover:bg-slate-700 rounded-lg font-semibold transition-colors">
                    Reiniciar
                </button>
            </div>
        </div>

        <!-- Mensaje de Estado -->
        <div class="bg-blue-50 border-b border-blue-100 p-4 text-center">
            <p id="status-message" class="text-blue-800 font-medium text-lg min-h-[28px]">
                Estructura jerárquica del inventario organizada por código SKU.
            </p>
        </div>

        <!-- Área del Gráfico SVG -->
        <div class="relative w-full h-[400px] bg-slate-50 flex justify-center overflow-visible">
            <svg id="tree-svg" width="800" height="400" class="overflow-visible"></svg>
        </div>

        <!-- Panel Inferior: Resultado In-Order -->
        <div class="p-6 bg-white border-t border-slate-200">
            <h3 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                Lista de Inventario (Ordenada por SKU)
            </h3>
            <div id="inorder-list" class="flex flex-wrap gap-3 min-h-[50px]">
                <span class="text-slate-400 italic" id="inorder-placeholder">Ejecuta el "Recorrido In-Order" para visualizar el escaneo de menor a mayor.</span>
            </div>
        </div>

        <!-- Panel de Análisis IA con Gemini -->
        <div class="p-6 bg-slate-50 border-t border-slate-200 rounded-b-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <span class="text-xl">✨</span> Asistente de Inventario IA
                </h3>
                <button 
                    id="btn-ai"
                    onclick="analyzeInventoryWithAI()" 
                    class="px-4 py-2 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white rounded-lg font-semibold transition-all shadow-md disabled:opacity-70 flex items-center gap-2"
                >
                    <span id="ai-btn-text">✨ Analizar Stock con IA</span>
                </button>
            </div>
            
            <div id="ai-result-container" class="hidden animate-fade-in bg-white border border-indigo-100 p-5 rounded-xl shadow-inner text-slate-700 whitespace-pre-wrap leading-relaxed">
            </div>
        </div>

    </div>

    <script>
        // --- DATOS Y ESTADO GLOBAL ---
        const initialNodesData = [
            { id: 'n500', sku: 500, name: 'Laptop', qty: 15, x: 400, y: 80, left: 'n200', right: 'n700' },
            { id: 'n200', sku: 200, name: 'Mouse', qty: 50, x: 200, y: 200, left: 'n100', right: 'n300' },
            { id: 'n700', sku: 700, name: 'Monitor', qty: 8, x: 600, y: 200, left: null, right: 'n800' },
            { id: 'n100', sku: 100, name: 'Cable USB', qty: 120, x: 100, y: 320, left: null, right: null },
            { id: 'n300', sku: 300, name: 'Teclado', qty: 30, x: 300, y: 320, left: null, right: null },
            { id: 'n800', sku: 800, name: 'Impresora', qty: 5, x: 700, y: 320, left: null, right: null },
        ];
        const nodeToInsert = { id: 'n600', sku: 600, name: 'Webcam', qty: 25, x: 500, y: 320, left: null, right: null };

        let nodes = JSON.parse(JSON.stringify(initialNodesData));
        let mode = 'static'; // 'static', 'insert', 'inorder'
        let animStep = 0;
        let activeNodeId = null;
        let inOrderList = [];
        let message = "Estructura jerárquica del inventario organizada por código SKU.";
        let animTimer = null;
        let isAnalyzing = false;

        // --- REFERENCIAS AL DOM ---
        const svgContainer = document.getElementById('tree-svg');
        const statusMessage = document.getElementById('status-message');
        const inorderListContainer = document.getElementById('inorder-list');
        const inorderPlaceholder = document.getElementById('inorder-placeholder');
        const btnInsert = document.getElementById('btn-insert');
        const btnInorder = document.getElementById('btn-inorder');
        const btnAi = document.getElementById('btn-ai');
        const aiBtnText = document.getElementById('ai-btn-text');
        const aiResultContainer = document.getElementById('ai-result-container');

        // --- RENDERIZADO DEL SVG ---
        function renderTree() {
            let svgContent = '';

            // Dibujar líneas
            nodes.forEach(node => {
                if (node.left) {
                    const child = nodes.find(n => n.id === node.left);
                    if (child) {
                        svgContent += `<line x1="${node.x}" y1="${node.y + 45}" x2="${child.x}" y2="${child.y - 45}" stroke="#cbd5e1" stroke-width="3" />`;
                    }
                }
                if (node.right) {
                    const child = nodes.find(n => n.id === node.right);
                    if (child) {
                        svgContent += `<line x1="${node.x}" y1="${node.y + 45}" x2="${child.x}" y2="${child.y - 45}" stroke="#cbd5e1" stroke-width="3" />`;
                    }
                }
            });

            // Nodo flotante animado para la Inserción
            if (mode === 'insert' && animStep > 0 && animStep < 5) {
                const positions = [
                    {x: 400, y: 20}, // Paso 1
                    {x: 400, y: 80}, // Paso 2
                    {x: 600, y: 200},// Paso 3
                    {x: 500, y: 320} // Paso 4
                ];
                const pos = positions[animStep - 1];
                const opacity = animStep === 4 ? 0 : 0.8;
                
                svgContent += `
                    <g class="svg-node" style="transform: translate(${pos.x}px, ${pos.y}px); opacity: ${opacity};">
                        <circle r="40" fill="none" stroke="#22c55e" stroke-width="4" stroke-dasharray="5,5" class="animate-spin-slow" />
                        <rect x="-35" y="-15" width="70" height="30" rx="15" fill="#22c55e" />
                        <text y="4" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">NUEVO: 600</text>
                    </g>
                `;
            }

            // Dibujar Nodos Reales
            nodes.forEach(node => {
                const isActive = activeNodeId === node.id;
                const isNew = node.id === 'n600' && mode === 'static' && nodes.length > 6;
                
                const fillColor = isActive ? "#3b82f6" : isNew ? "#22c55e" : "#ffffff";
                const strokeColor = isActive ? "#1d4ed8" : isNew ? "#16a34a" : "#64748b";
                const strokeWidth = isActive || isNew ? "4" : "2";
                const textPrimaryColor = isActive || isNew ? "#fff" : "#0f172a";
                const textSecColor = isActive || isNew ? "#e0f2fe" : "#334155";
                const textTertColor = isActive || isNew ? "#bfdbfe" : "#64748b";

                svgContent += `
                    <g class="svg-node drop-shadow-md" style="transform: translate(${node.x}px, ${node.y}px);">
                        <circle r="45" fill="${fillColor}" stroke="${strokeColor}" stroke-width="${strokeWidth}" />
                        <text y="-12" text-anchor="middle" fill="${textPrimaryColor}" font-size="14" font-weight="bold">SKU: ${node.sku}</text>
                        <text y="6" text-anchor="middle" fill="${textSecColor}" font-size="12">${node.name}</text>
                        <text y="24" text-anchor="middle" fill="${textTertColor}" font-size="11" font-weight="500">Cant: ${node.qty}</text>
                    </g>
                `;
            });

            svgContainer.innerHTML = svgContent;
        }

        // --- ACTUALIZACIÓN DE INTERFAZ ---
        function updateUI() {
            statusMessage.innerText = message;
            
            btnInsert.disabled = mode !== 'static';
            btnInorder.disabled = mode !== 'static';

            // Actualizar lista in-order
            if (inOrderList.length > 0) {
                inorderPlaceholder.style.display = 'none';
                let listHtml = '';
                const allPossibleNodes = [...initialNodesData, nodeToInsert];
                
                inOrderList.forEach(sku => {
                    const prod = allPossibleNodes.find(n => n.sku === sku);
                    if (prod) {
                        listHtml += `
                            <div class="animate-fade-in bg-purple-100 border border-purple-200 text-purple-800 px-4 py-2 rounded-lg flex flex-col shadow-sm">
                                <span class="font-bold text-sm">SKU: ${prod.sku}</span>
                                <span class="text-xs">${prod.name} - Cant: ${prod.qty}</span>
                            </div>
                        `;
                    }
                });
                // Preservar los que ya estaban y añadir los nuevos
                if(inorderListContainer.innerHTML.indexOf('italic') !== -1) {
                    inorderListContainer.innerHTML = listHtml;
                } else {
                    inorderListContainer.innerHTML = listHtml;
                }
            } else if (mode !== 'inorder') {
                inorderListContainer.innerHTML = '<span class="text-slate-400 italic" id="inorder-placeholder">Ejecuta el "Recorrido In-Order" para visualizar el escaneo de menor a mayor.</span>';
            }

            renderTree();
        }

        // --- LÓGICA DE ANIMACIONES ---
        function startInsertion() {
            clearTimeout(animTimer);
            nodes = JSON.parse(JSON.stringify(initialNodesData));
            inOrderList = [];
            mode = 'insert';
            animStep = 0;
            activeNodeId = null;
            runInsertionSteps();
        }

        function runInsertionSteps() {
            const steps = [
                { msg: "Iniciando inserción del nuevo producto: Webcam (SKU: 600)", active: null },
                { msg: "Comparando 600 con la raíz (500). Como 600 > 500, vamos a la DERECHA (n.der).", active: 'n500' },
                { msg: "Comparando 600 con el nodo actual (700). Como 600 < 700, vamos a la IZQUIERDA (n.izq).", active: 'n700' },
                { msg: "La referencia izquierda de 700 es NULL. ¡Caso base alcanzado! Insertamos aquí.", active: 'n700' },
                { msg: "Nodo insertado exitosamente.", active: 'n600', inserted: true }
            ];

            if (animStep < steps.length) {
                message = steps[animStep].msg;
                activeNodeId = steps[animStep].active;
                
                if (steps[animStep].inserted) {
                    // Actualizar árbol con el nuevo nodo
                    let parent = nodes.find(n => n.id === 'n700');
                    if(parent) parent.left = 'n600';
                    nodes.push(JSON.parse(JSON.stringify(nodeToInsert)));
                }

                updateUI();
                animStep++;
                animTimer = setTimeout(runInsertionSteps, 3000);
            } else {
                animTimer = setTimeout(() => {
                    mode = 'static';
                    activeNodeId = null;
                    updateUI();
                }, 1000);
            }
        }

        function startInOrder() {
            clearTimeout(animTimer);
            // Asegurarnos que el nodo 600 esté en el árbol para el recorrido completo
            nodes = JSON.parse(JSON.stringify(initialNodesData));
            let parent = nodes.find(n => n.id === 'n700');
            if(parent) parent.left = 'n600';
            nodes.push(JSON.parse(JSON.stringify(nodeToInsert)));
            
            inOrderList = [];
            mode = 'inorder';
            animStep = 0;
            activeNodeId = null;
            inorderListContainer.innerHTML = ''; // Limpiar lista visualmente
            runInOrderSteps();
        }

        function runInOrderSteps() {
            const traversalSteps = [
                { msg: "Iniciando Recorrido In-Order (Izquierda -> Raíz -> Derecha)", active: null, list: [] },
                { msg: "Escaneando subárbol izquierdo profundo...", active: 'n100', list: [100] },
                { msg: "Visitando raíz del subárbol...", active: 'n200', list: [100, 200] },
                { msg: "Escaneando subárbol derecho...", active: 'n300', list: [100, 200, 300] },
                { msg: "Visitando Raíz Principal...", active: 'n500', list: [100, 200, 300, 500] },
                { msg: "Escaneando subárbol izquierdo del lado derecho...", active: 'n600', list: [100, 200, 300, 500, 600] },
                { msg: "Visitando raíz del subárbol derecho...", active: 'n700', list: [100, 200, 300, 500, 600, 700] },
                { msg: "Visitando último nodo a la derecha. ¡Inventario ordenado!", active: 'n800', list: [100, 200, 300, 500, 600, 700, 800] }
            ];

            if (animStep < traversalSteps.length) {
                message = traversalSteps[animStep].msg;
                activeNodeId = traversalSteps[animStep].active;
                inOrderList = traversalSteps[animStep].list;
                
                updateUI();
                animStep++;
                animTimer = setTimeout(runInOrderSteps, 2000);
            } else {
                animTimer = setTimeout(() => {
                    mode = 'static';
                    activeNodeId = null;
                    updateUI();
                }, 2000);
            }
        }

        function resetApp() {
            clearTimeout(animTimer);
            nodes = JSON.parse(JSON.stringify(initialNodesData));
            inOrderList = [];
            mode = 'static';
            activeNodeId = null;
            message = "Estructura jerárquica del inventario organizada por código SKU.";
            
            aiResultContainer.classList.add('hidden');
            aiResultContainer.innerHTML = '';
            
            updateUI();
        }

        // --- INTEGRACIÓN IA GEMINI ---
        async function analyzeInventoryWithAI() {
            if (isAnalyzing) return;
            
            isAnalyzing = true;
            btnAi.disabled = true;
            aiResultContainer.classList.add('hidden');
            aiBtnText.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Analizando...`;
            
            const apiKey = ""; // El entorno provee la clave
            const inventoryData = nodes.map(n => ({ sku: n.sku, producto: n.name, cantidad: n.qty }));
            const prompt = `Actúa como un experto en logística. Analiza el siguiente inventario y dame 3 viñetas concisas: 
            1) Alertas de stock crítico (menos de 10 unidades). 
            2) Productos con stock saludable o excesivo. 
            3) Una recomendación estratégica de compras o distribución. 
            Inventario actual: ${JSON.stringify(inventoryData)}`;

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: "Eres un asistente experto en inventarios y logística. Responde de forma amigable, estructurada y siempre en español." }] }
            };

            let attempt = 0;
            const maxRetries = 5;
            const delays = [1000, 2000, 4000, 8000, 16000];
            let resultText = "No se pudo generar el análisis.";

            while (attempt <= maxRetries) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const data = await response.json();
                    resultText = data.candidates?.[0]?.content?.parts?.[0]?.text || resultText;
                    break; // Éxito
                } catch (error) {
                    if (attempt === maxRetries) {
                        resultText = "⚠️ Lo sentimos, hubo un error de conexión con la IA después de varios intentos. Por favor, intenta de nuevo más tarde.";
                        break;
                    }
                    await new Promise(res => setTimeout(res, delays[attempt]));
                    attempt++;
                }
            }
            
            aiResultContainer.innerHTML = resultText;
            aiResultContainer.classList.remove('hidden');
            
            isAnalyzing = false;
            btnAi.disabled = false;
            aiBtnText.innerHTML = `✨ Analizar Stock con IA`;
        }

        // Render inicial
        updateUI();
    </script>
</body>
</html>
